<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Сапёр УНО</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#183226;color:#fff;font-family:Rubik,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px;padding:8px;box-sizing:border-box;overflow-y:auto}
button{font:inherit;color:#fff;background:#2E8049;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;margin:4px}
button.gh{background:#444}button.on{outline:3px solid #F2C94C}button.red{background:#C23B33}
input{font:inherit;font-size:20px;text-transform:uppercase;width:90px;text-align:center;border-radius:10px;border:2px solid #fff4;background:#0006;color:#fff;padding:8px}
.ctr{margin:auto;text-align:center}
#opps{display:flex;flex-wrap:wrap;gap:6px}
.op{flex:1 1 70px;background:#0006;border-radius:10px;padding:6px;font-size:12px;box-sizing:border-box}
.op.cur{animation:pulse 1.2s infinite;outline:2px solid #F2C94C}.op.dead{opacity:.35}
.bar{height:8px;background:#0008;border-radius:4px;margin:4px 0;overflow:hidden}.bar i{display:block;height:100%;background:#E05A52;transition:width .6s}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#row{display:flex;align-items:center;gap:14px}
#mines{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.mn{background:#444;border-radius:12px;padding:3px 10px;font-size:13px}
#log{font-size:13px;text-align:center;min-height:80px;opacity:.9}#log div:first-child{font-weight:700}
#hand{display:flex;gap:4px;overflow-x:auto;padding:6px 0}#hand>div{flex:none}.dim{opacity:.4}
#m{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9}
#m[hidden]{display:none}.box{background:#183226;border:2px solid #fff3;border-radius:16px;padding:16px;max-width:340px;text-align:center}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#C23B33;border-radius:10px;padding:8px 14px;z-index:10;font-size:14px}
#toast:empty{display:none}
.code{font-size:44px;font-weight:700;letter-spacing:.15em}
.c{width:150px;height:220px;border-radius:16px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;box-sizing:border-box;border:4px solid #fff;background:linear-gradient(155deg,var(--a),var(--k));box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.15)}
.o{width:104px;height:156px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#E9E6DF);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t);box-shadow:0 0 0 4px rgba(255,255,255,.3)}
.n{position:absolute;font-weight:700;font-size:20px}.t{top:10px;left:12px}.b{bottom:10px;right:12px;transform:rotate(180deg)}
.g{font-size:56px;font-weight:700;line-height:1}.s{font-size:34px}.l{font-size:11px;letter-spacing:.06em;font-weight:700}
.wl{position:absolute;bottom:10px;font-size:11px;font-weight:700}
h3{margin:0 0 8px}
@keyframes pop{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes flash{50%{background:#E05A52}}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 6px #F2C94C66}}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .5s ease-out}.hit{animation:shake .45s,flash .45s}.new{animation:slide .45s}
.fl{position:fixed;font-weight:700;font-size:22px;color:#fff;background:#C23B33;border-radius:10px;padding:2px 10px;animation:up 1.6s forwards;pointer-events:none;z-index:8}
.bm{position:fixed;left:50%;top:40%;font-size:90px;animation:boom 1s forwards;pointer-events:none;z-index:8}
</style>
</head>
<body>
<div id="app"></div>
<div id="m" hidden></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const COL={r:['#E05A52','#C23B33'],b:['#4A8BEA','#2F6FD1'],g:['#4FB36F','#2E8049'],y:['#F2C94C','#E3B21F']};
const TC=['#C23B33','#2F6FD1'];
const CN={r:'красный',b:'синий',g:'зелёный',y:'жёлтый'},COLS=Object.keys(COL);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S='viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"';
const IC={
s:'<svg width="62" height="62" viewBox="0 0 80 80"><g stroke="#2B2F38" stroke-width="6" stroke-linecap="round"><path d="M40 10v10M40 60v10M10 40h10M60 40h10M19 19l7 7M61 19l-7 7M19 61l7-7M61 61l-7-7"/></g><circle cx="40" cy="40" r="21" fill="#2B2F38"/><path d="M27 35a14 14 0 0 1 10-11" stroke="#fff" stroke-opacity=".4" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="40" cy="40" r="6" fill="#E04B3F"/></svg>',
d:`<svg width="40" height="40" ${S} fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>`,
h:`<svg width="40" height="40" ${S} fill="currentColor"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/><path d="M12 9.5v5M9.5 12h5" stroke="#fff"/></svg>`,
k:'<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.5"><path d="M7 5v7a5 5 0 0 0 10 0V5"/><path d="M7 5v3M17 5v3" stroke="#E04B3F"/></svg>',
skip:`<svg width="52" height="52" ${S} fill="none"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>`,
rev:`<svg width="52" height="52" ${S} fill="none"><path d="M5 9h12M14 6l3 3-3 3M19 15H7M10 12l-3 3 3 3"/></svg>`};
const TY={
n:c=>({inner:`<span class=g>${c.v}</span>`,cr:c.v}),
s:c=>({inner:IC.s+'<span class=l>САПЁР</span>'}),
d:c=>({col:['#34343E','#17171C'],t:'#C23B33',inner:IC.d+`<span class="g s">+${c.v}</span><span class=l>УРОН</span>`,cr:'+'+c.v}),
h:c=>({col:['#1FA3A3','#0E7373'],inner:IC.h+`<span class="g s">+${c.v}</span><span class=l>ЛЕЧЕНИЕ</span>`,cr:'+'+c.v}),
k:c=>({col:['#7B55B4','#5B3A8C'],inner:IC.k+'<span class=l>ДОКОПАЙСЯ</span>'}),
skip:c=>({inner:IC.skip+'<span class=l>ПРОПУСК</span>'}),
rev:c=>({inner:IC.rev+'<span class=l>РАЗВОРОТ</span>'}),
w:c=>({col:['#34343E','#17171C'],w:1,inner:''})};
function cardEl(c,z){const d=TY[c.t](c),[a,k]=d.col||COL[c.c],t=d.t||(c.c=='y'?'#1A1A1A':k),cc=c.c=='y'?'color:#1A1A1A':'';
return `<div class="c" style="--a:${a};--k:${k};--t:${t};zoom:${z}">${d.cr?`<span class="n t" style="${cc}">${d.cr}</span>`:''}<div class=o${d.w?' style="background:conic-gradient(#C23B33 0 25%,#2F6FD1 0 50%,#2E8049 0 75%,#E3B21F 0);height:130px;box-shadow:0 0 0 4px #fff"':''}>${d.inner}</div>${d.w?'<span class=wl>СМЕНА ЦВЕТА</span>':''}${d.cr?`<span class="n b" style="${cc}">${d.cr}</span>`:''}</div>`}

const RULES=`💣 Сапёр УНО — правила

🎯 Цель: остаться последним игроком с ХП.
Режимы: быстрая — 150 ХП, обычная — 300 ХП. Игроков: 2–8. У каждого по 8 карт.

🃏 Ход: клади карту того же цвета или значения, что на столе. Нечего класть — бери одну карту (если она подошла, можно сыграть). Автодобора нет.

💣 Сапёр: ставит мину своего цвета. Второй сапёр того же цвета взрывает её: числа, сыгранные между ними, суммируются, и следующий игрок теряет столько ХП. Два сапёра подряд — следующий теряет половину ХП.

⚡ Урон (+10, +15, +20): бьёшь любого игрока. Если ударили тебя (уроном или взрывом), можно сразу ответить контр-ударом картой урона.

💊 Лечение (+10, +20): лечишь себя, но не выше максимума.

🧲 Докопайся: следующий игрок тянет карты, пока не выпадет карта цвета, который лежал на столе, и сразу кладёт её.

🔋 Перезарядка: сбросил все карты — получаешь +50% от максимума ХП (в командах +25% общего запаса, но не выше максимума) и берёшь 8 новых.

Классика: ⏭ пропуск, 🔄 разворот, 🎨 смена цвета.

👥 Командный режим (1×1, 2×2, 3×3, 4×4 — всего 2, 4, 6 или 8 игроков): общий запас ХП на команду, бить можно только соперников.`;
let ws,V=null,sel={hp:150,n:2,ts:4,thp:300},TS=[2,4,6,8],TL={2:'1×1',4:'2×2',6:'3×3',8:'4×4'},picking=0,codeIn='',prevHand=0,joined=0;
const uid=localStorage.uid||(localStorage.uid=Math.random().toString(36).slice(2));
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function toast(t){const e=$('#toast');e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.textContent='',2000)}
function conn(){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
ws.onopen=()=>{send({a:'hello',init:tg?tg.initData:'',uid,name:(tg&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'Гость'});
const sp=tg&&tg.initDataUnsafe.start_param;
if(V)send({a:'join',room:V.room});else if(sp&&!joined){joined=1;send({a:'join',room:sp})}};
ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.s=='err'){toast(m.t);return}
if(m.s=='rules'){modal('<h3>📖 Правила</h3><div style="text-align:left;white-space:pre-wrap;font-size:14px;max-height:60vh;overflow:auto">'+esc(m.t)+'</div><button data-x=1>Понятно</button>',hide);return}
V=m.v;render(m.ev||[])};
ws.onclose=()=>setTimeout(conn,1500)}
const ok=c=>{const t=V.top;if('dhkw'.includes(c.t))return 1;if(c.c==V.col)return 1;return c.t=='n'?(t.t=='n'&&t.v==c.v):(c.t==t.t&&(c.t=='skip'||c.t=='rev'))};
function modal(h,f){const m=$('#m');m.innerHTML='<div class=box>'+h+'</div>';m.hidden=false;m.onclick=e=>{const b=e.target.closest('button');if(b)f(b)}}
const hide=()=>{$('#m').hidden=true};
const pick=(title,opts)=>new Promise(res=>modal(`<h3>${title}</h3>`+opts.map(([k,n,bg])=>`<button style="background:${bg}" data-k="${k}">${esc(n)}</button>`).join('')+'<br><button class=gh data-x=1>Отмена</button>',b=>{hide();if(b.dataset.x)return res(null);const k=b.dataset.k;res(isNaN(+k)?k:+k)}));
const hpBtns=()=>[150,300].map(v=>`<button data-hp="${v}" class="${sel.hp==v?'on':''}" onclick="sel.hp=${v};render([])">${v==150?'Быстрая · 150 ХП':'Обычная · 300 ХП'}</button>`).join('');
function menu(){return `<div class=ctr><h3 style="font-size:28px">💣 Сапёр УНО</h3>${hpBtns()}<br><br>Против компьютера:<br>${[1,2,3].map(v=>`<button class="${sel.n==v?'on':''}" onclick="sel.n=${v};render([])">${v} бот${v>1?'а':''}</button>`).join('')}<br><button class=red onclick="send({a:'solo',hp:sel.hp,n:sel.n})">🤖 Играть</button><br><br>Командами против ботов:<br>${TS.map(v=>`<button class="${sel.ts==v?'on':''}" onclick="sel.ts=${v};render([])">${TL[v]}</button>`).join('')}<br>${[300,600].map(v=>`<button class="${sel.thp==v?'on':''}" onclick="sel.thp=${v};render([])">${v} ХП</button>`).join('')}<br><button class=red onclick="send({a:'solo',team:1,size:sel.ts,hp:sel.thp})">🤖 Играть командой</button><br><br>С друзьями:<br><button onclick="send({a:'create'})">👥 Создать комнату</button><br><input id=ci maxlength=4 placeholder="КОД" value="${esc(codeIn)}" oninput="codeIn=this.value"><button onclick="send({a:'join',room:codeIn})">Войти</button><br><button class=gh onclick="send({a:'rules'})">📖 Правила</button></div>`}
function rules(){modal(`<div style="text-align:left;white-space:pre-wrap;max-height:65vh;overflow:auto;font-size:14px">${esc(RULES)}</div><button class=gh data-x=1>Закрыть</button>`,hide)}
function share(){const link=V.bot?`https://t.me/${V.bot}${V.app?'/'+V.app:''}?startapp=${V.room}`:location.href;
const u='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent('Го играть в Сапёр УНО! Код комнаты: '+V.room);tg?tg.openTelegramLink(u):open(u)}
function lobby(){const o=V.team?[300,600]:[150,300],hp=o.includes(sel.hp)?sel.hp:o[0];
const btn=o.map((v,i)=>`<button class="${hp==v?'on':''}" onclick="sel.hp=${v};render([])">${i?'Обычная · ':'Быстрая · '}${v} ХП</button>`).join('');
const row=p=>`<div>${p.bot?'🤖':'👤'} ${esc(p.name)}</div>`;
const body=V.team?`<div style="display:flex;gap:10px">${[0,1].map(t=>`<div style="flex:1;background:#0006;border-radius:12px;padding:8px;border-top:4px solid ${TC[t]}"><b>${t?'Синие':'Красные'}</b> ${V.P.filter(p=>p.team==t).length}/${V.size/2}${V.P.map(p=>p.team==t?row(p):'').join('')}</div>`).join('')}</div><button class=gh onclick="send({a:'team',t:${V.P[V.you].team?0:1}})">Перейти в другую команду</button>`:V.P.map(row).join('');
const host=V.host?`<br><button class="${V.team?'':'on'}" onclick="send({a:'mode',team:false})">Каждый сам</button><button class="${V.team?'on':''}" onclick="send({a:'mode',team:true})">Команды</button>${V.team?`<br>${TS.map(v=>`<button class="${V.size==v?'on':''}" onclick="send({a:'size',n:${v}})">${TL[v]}</button>`).join('')}<br><button class="${V.open?'on':''}" onclick="send({a:'open',on:${!V.open}})">Карты напарника видны: ${V.open?'да':'нет'}</button>`:''}<br>${btn}<br><button onclick="send({a:'bot'})">+ Бот</button>${V.team?`<button onclick="send({a:'fill'})">🤖 Заполнить</button>`:''}<button class=red onclick="send({a:'start',hp:${hp}})">▶ Начать</button>`:'<br>Ждём, пока хозяин начнёт игру…';
return `<div class=ctr><div>Код комнаты</div><div class=code>${V.room}</div><button onclick="share()">📨 Позвать друзей</button><br><br>${body}${host}<br><button class=gh onclick="leave()">Выйти</button></div>`}
function leave(){send({a:'leave'});V=null;hide();render([])}
async function tap(ci){if(!V||V.phase!='play'||V.cur!=V.you||V.cn||V.wait>=0||picking)return;const c=V.hand[ci];if(!c||!ok(c))return;const o={a:'play',ci};picking=1;
if(c.t=='w'){o.col=await pick('Выбери цвет',COLS.map(k=>[k,CN[k],COL[k][1]]));if(!o.col){picking=0;return}}
if(c.t=='d'){o.t=await pick('Кого бьём?',V.P.map((p,j)=>[j,p.name,'#444']).filter(x=>x[0]!=V.you&&V.P[x[0]].alive&&(!V.team||V.P[x[0]].team!=V.P[V.you].team)));if(o.t===null){picking=0;return}}
picking=0;send(o)}
function drawBtn(){if(!V||V.phase!='play'||V.cur!=V.you||V.drawn||V.cn||V.wait>=0)return;if(V.hand.some(ok)){toast('Есть что положить — тянуть нельзя');return}send({a:'draw'})}
function render(ev){const A=$('#app');
if(!V){A.innerHTML=menu();hide();return}
if(V.phase=='lobby'){A.innerHTML=lobby();hide();return}
const me=V.P[V.you],my=V.cur==V.you&&V.phase=='play'&&!V.cn&&V.wait<0;
const opps=V.P.map((p,j)=>j==V.you?'':`<div class="op ${V.cur==j&&V.phase=='play'?'cur':''} ${p.alive?'':'dead'}" data-i="${j}"${V.team?` style="border:3px solid ${TC[p.team]}"`:''}><b>${esc(p.name)}${p.bot?' 🤖':p.on?'':' ⌛'}</b>${V.team?`<br>${V.P[V.you].team==p.team?'напарник · ':''}${p.n} карт`:`<div class=bar><i style="width:${p.hp/V.max*100}%"></i></div>${p.hp} ХП · ${p.n} карт`}</div>`).join('');
const tbar=V.team?`<div style="display:flex;gap:6px">${[0,1].map(t=>`<div class=op style="border-top:4px solid ${TC[t]}"><b>${t?'Синие':'Красные'}</b> ${V.tp[t]} / ${V.max}<div class=bar><i style="width:${V.tp[t]/V.max*100}%;background:${TC[t]}"></i></div></div>`).join('')}</div>`:'';
const mates=V.mates&&V.mates.length?`<div style="font-size:12px;opacity:.8">Карты напарника:</div><div style="display:flex;gap:3px;overflow-x:auto">${V.mates.map(m=>m.hand.map(c=>`<div style="flex:none">${cardEl(c,.3)}</div>`).join('')).join('')}</div>`:'';
const pop=ev.some(e=>e.k=='card');
const mines=Object.keys(V.mines).map(c=>`<span class=mn style="background:${COL[c][1]}">💣 ${V.mines[c]}</span>`).join('')||'<span class=mn>Мин нет</span>';
const wait=V.wait>=0&&V.wait!=V.you?`<div>⏳ ${esc(V.P[V.wait].name)} решает: контр-удар?</div>`:'';
const nw=Math.max(0,V.hand.length-prevHand);prevHand=V.hand.length;
A.innerHTML=`${tbar}<div id=opps>${opps}</div><div id=mid><div id=mines>${mines}</div><div id=row><button onclick="drawBtn()" style="padding:0;background:none;zoom:.55"><div class=c style="--a:#34343E;--k:#17171C;--t:#fff;font-size:20px;font-weight:700">Колода<br>${V.dn}</div></button><div class="${pop?'pop':''}">${cardEl(V.top,.7)}</div><span class=mn style="background:${COL[V.col][1]}">${CN[V.col]}</span></div><div id=log>${wait}${V.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>
<div class="op ${my?'cur':''}" data-i="${V.you}"><b>Ты</b> — ${me.hp} ХП ${my?'· твой ход'+(V.drawn?' <button onclick="send({a:\'pass\'})">Пас</button>':''):''}${me.alive?'':'· ты выбыл'}<div class=bar><i style="width:${me.hp/V.max*100}%"></i></div></div>
<div id=hand>${V.hand.map((c,k)=>`<div onclick="tap(${k})" class="${my&&!ok(c)?'dim':''} ${k>=V.hand.length-nw?'new':''}">${cardEl(c,.55)}</div>`).join('')}</div>${mates}`;
if(V.cn){picking=0;let h='<h3>Тебя ударили! Контр-удар?</h3>';V.cn.v.forEach(v=>V.cn.en.forEach(j=>h+=`<button data-v="${v}" data-j="${j}">+${v} → ${esc(V.P[j].name)}</button>`));
modal(h+'<br><button class=gh data-n=1>Не отвечать</button>',b=>{hide();send(b.dataset.n?{a:'nocounter'}:{a:'counter',v:+b.dataset.v,t:+b.dataset.j})})}
else if(V.phase=='over'){const w=V.winner;modal(`<h3>${V.team?(w==V.P[V.you].team?'🏆 Ваша команда победила!':'💥 Ваша команда проиграла'):(w==V.you?'🏆 Ты победил!':w>=0?esc(V.P[w].name)+' победил':'💥 Ты проиграл')}</h3>${V.host?`<button class=red onclick="send({a:'start',hp:V.max})">Играть снова</button>`:'Ждём хозяина комнаты'}<br><button class=gh onclick="leave()">В меню</button>`,()=>{})}
else if(!picking)hide();
ev.forEach(f=>{if(f.k=='boom'){const b=document.createElement('div');b.className='bm';b.textContent='💥';document.body.appendChild(b);setTimeout(()=>b.remove(),1100);return}
if(f.k!='hit'&&f.k!='heal'&&f.k!='rch')return;
const el=document.querySelector(`[data-i="${f.i}"]`);if(!el)return;const g=f.k!='hit';
